name: link-probe
on:
  push:
    branches: [arena/4a21732a-my-files]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source PDF
        run: |
          set -x
          URL="https://cf.linkulu.com/dl/6ae1aa03c8b58d63b66d7e6d"
          curl -sIL -A "Mozilla/5.0" --max-time 60 "$URL" | head -30
          curl -L -A "Mozilla/5.0" --max-time 600 -o original.pdf "$URL"
          ls -l original.pdf
          head -c 8 original.pdf | xxd
          sha256sum original.pdf
          python3 -c "import pymupdf" 2>/dev/null || pip install --quiet pymupdf
          python3 - <<'PY'
          import pymupdf
          d = pymupdf.open("original.pdf")
          print("PAGES:", d.page_count)
          print("VERSION:", d.metadata.get("format"), d.metadata.get("producer"))
          print("META:", d.metadata)
          s = d[0].read_contents()
          print("STREAM0_LEN:", len(s))
          print("STREAM0:", s[:600])
          print("IMAGES0:", d[0].get_images(full=True))
          PY
