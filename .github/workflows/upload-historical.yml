name: Upload historical images to book/images/historical

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download images to book/images/historical
        shell: bash
        run: |
          set -uo pipefail
          DEST="book/images/historical"
          mkdir -p "$DEST"
          failed=""
          
          # هدر User-Agent الزامی برای ویکی‌مدیا
          UA="Mozilla/5.0 (compatible; MyFilesBot/1.0; +https://github.com/AmirGFno/my-files)"

          resolve_wikimedia_url() {
            local fname="$1"
            local stem="${fname%.*}"
            for title in "File:${fname}" "File:${stem}.jpg" "File:${stem}.JPG" "File:${stem}.jpeg" "File:${stem}.png" "File:${stem}.svg" "File:${stem}.tif" "File:${stem}.tiff"; do
              local u
              u=$(curl -fsSL -A "$UA" -G "https://commons.wikimedia.org/w/api.php" \
                    --data-urlencode "action=query" \
                    --data-urlencode "titles=$title" \
                    --data-urlencode "prop=imageinfo" \
                    --data-urlencode "iiprop=url" \
                    --data-urlencode "format=json" \
                    --data-urlencode "formatversion=2" \
                  | jq -r '.query.pages[0].imageinfo[0].url // empty' 2>/dev/null || true)
              if [ -n "$u" ]; then echo "$u"; return 0; fi
            done
            return 1
          }

          download_one() {
            fname="$1"; url="$2"
            echo "::group::$fname"
            ok=0
            
            # تلاش مستقیم با محدودیت زمانی
            if curl -fL -A "$UA" --retry 2 --retry-delay 5 --retry-max-time 30 -o "$DEST/$fname" "$url"; then
              ok=1
            else
              if [[ "$url" == *"upload.wikimedia.org"* ]]; then
                echo "Direct URL failed; resolving via Wikimedia API…"
                resolved=$(resolve_wikimedia_url "$fname" || true)
                if [ -n "$resolved" ]; then
                  echo "Resolved: $resolved"
                  if curl -fL -A "$UA" --retry 2 --retry-delay 5 --retry-max-time 30 -o "$DEST/$fname" "$resolved"; then
                    ok=1
                  fi
                fi
              fi
            fi

            if [ "$ok" = "1" ]; then
              ls -lh "$DEST/$fname"
            else
              echo "::warning::Failed to download $fname from $url"
              rm -f "$DEST/$fname"
              failed="$failed $fname"
            fi
            echo "::endgroup::"

            # تاخیر ۳ ثانیه‌ای بین هر دانلود برای جلوگیری از مسدود شدن
            sleep 3
          }

          while IFS='|' read -r fname url; do
            [ -z "$fname" ] && continue
            download_one "$fname" "$url"
          done <<'EOF'
          H01_CH01_antikythera-mechanism.jpg|https://upload.wikimedia.org/wikipedia/commons/6/63/Antikythera_Mechanism_%28NAMA%29_2017.jpg
          H46_CH01_prague-orloj-dial.jpg|https://upload.wikimedia.org/wikipedia/commons/4/43/Praha_Astronomical_Clock_Dial_01.jpg
          H50_CH03_cancer-al-sufi.jpg|https://upload.wikimedia.org/wikipedia/commons/1/15/Book_of_the_Fixed_Stars_Auv0265_Cancer.jpg
          H05_CH04_dioscuri-castor-pollux.jpg|https://upload.wikimedia.org/wikipedia/commons/1/18/Castor_and_Pollux%2C_archaic_relief%2C_AM_of_Delphi%2C_201363.jpg
          H07_CH05_gilgamesh-flood-tablet.jpg|https://upload.wikimedia.org/wikipedia/commons/5/5b/British_Museum_Flood_Tablet_1.jpg
          H08_CH05_pyramid-of-djoser.jpg|https://upload.wikimedia.org/wikipedia/commons/3/3e/Pyramid_of_Djoser_2010.jpg
          H09_CH05_red-pyramid-dahshur.jpg|https://upload.wikimedia.org/wikipedia/commons/e/e5/Dahshur_-_Red_Pyramid_from_road.JPG
          H10_CH05_giza-pyramids-panorama.jpg|https://upload.wikimedia.org/wikipedia/commons/9/99/Giza_Pyramids_Panorama.jpg
          H11_CH05_great-sphinx.jpg|https://upload.wikimedia.org/wikipedia/commons/c/ce/Great_Sphinx_%28%D8%A3%D8%A8%D9%88_%D8%A7%D9%84%D9%87%D9%88%D9%84%29.jpg
          H16_CH05_apis-bull.jpg|https://upload.wikimedia.org/wikipedia/commons/a/a9/Statuette_of_the_Apis_bull%2C_bronze_-_Museo_Egizio_Turin_S_105_p01.jpg
          H20_CH06_beit-alpha-akedah.jpg|https://upload.wikimedia.org/wikipedia/commons/9/96/Beit_alfa01.jpg
          H26_CH07_agnus-dei-san-vitale.jpg|https://upload.wikimedia.org/wikipedia/commons/a/a5/Basilica_of_San_Vitale_-_Lamb_of_God_mosaic.jpg
          H29_CH07_four-yugas.svg|https://upload.wikimedia.org/wikipedia/commons/5/59/Four_Yugas_of_Hindu_Eschatology.svg
          H30_CH07_krishna-arjuna-chariot.jpg|https://upload.wikimedia.org/wikipedia/commons/3/37/Krishna_and_Arjun_on_the_chariot%2C_Mahabharata%2C_18th-19th_century%2C_India.jpg
          H32_CH07_maitrey-gandhara.jpg|https://upload.wikimedia.org/wikipedia/commons/e/ec/Maitreya%2C_2nd_century_CE%2C_Loriyan_Tangai%2C_Gandhara_Gallery%2C_Indian_Museum%2C_Kolkata.-4959-A23500.jpg
          H37_CH08_aquarius-al-sufi.jpg|https://upload.wikimedia.org/wikipedia/commons/5/53/Book_of_the_Fixed_Stars_Auv0302_Aquarius.jpg
          H72_CH08_earthrise-apollo-8.jpg|https://raw.githubusercontent.com/ILLorange/Techmanie-fotky-/main/1968%20-%20Apollo%208/NASA-Apollo8-Dec24-Earthrise.jpg
          H75_CH10_shush-archers-frieze.jpg|https://upload.wikimedia.org/wikipedia/commons/c/cf/Frieze_of_Archers_AOD_488%2C_Louvre_2008.jpg
          H54_CH05_khufu-solar-boat.jpg|https://upload.wikimedia.org/wikipedia/commons/5/56/GEM_Khufus_Boat_front_2025.jpg
          H55_CH05_karnak-hypostyle-hall.jpg|https://upload.wikimedia.org/wikipedia/commons/6/6b/Columns_at_Hypostyle_hall_of_Karnak_Temple_in_Luxor_Egypt.jpg
          H57_CH05_enuma-elish-tablet.jpg|https://upload.wikimedia.org/wikipedia/commons/4/4a/Enuma_Elish_K.3473.jpg
          H58_CH05_standard-of-ur.jpg|https://upload.wikimedia.org/wikipedia/commons/3/38/Denis_Bourez_-_British_Museum%2C_London_%288747049029%29_%282%29.jpg
          H61_CH06_ketef-hinom-scrolls.JPG|https://upload.wikimedia.org/wikipedia/commons/a/a4/Ketef_hinom_scrolls.JPG
          H62_CH06_cyrus-cylinder.jpg|https://upload.wikimedia.org/wikipedia/commons/7/76/Cyrus_Cylinder%2C_Babylon%2C_Iraq%2C_mid_500s_BC%2C_cuneiform_on_clay_-_British_Museum_-_DSC01316.jpg
          H63_CH06_faravahar-persepolis.jpg|https://upload.wikimedia.org/wikipedia/commons/7/7c/Faravahar_sign_in_Takhte_Jamshid.jpg
          H66_CH07_sanchi-torana.jpg|https://upload.wikimedia.org/wikipedia/commons/1/1e/East_Torana%2C_Sanchi_01.jpg
          H53_CH05_narmer-palette.jpg|https://upload.wikimedia.org/wikipedia/commons/b/be/Narmer_Palette.jpg
          # ---- فصل دوم — عصر اول؛ شیر (اسد) ----
          H02_CH02_gobekli-tepe-enclosure-d.jpg|https://upload.wikimedia.org/wikipedia/commons/e/ec/G%C3%B6beklitepe_Building_D_5351.jpg
          H47_CH02_gobekli-tepe-pillar-predator.jpg|https://upload.wikimedia.org/wikipedia/commons/d/d4/G%C3%B6bekli_Tepe_Enclosure_C_Pillar_27_relief.jpg
          H48_CH02_lion-man-hohlenstein-stadel.jpg|https://upload.wikimedia.org/wikipedia/commons/4/4c/Loewenmensch1.jpg
          H03_CH02_nemrut-lion-horoscope.jpg|https://upload.wikimedia.org/wikipedia/commons/6/6b/L%C3%B6wenhoroskop_Humann_1883.jpg
          EOF

          # ردیف‌های تازه (فصل‌های بعد) از این فایل خوانده می‌شوند؛ هر خط: fname|url
          # اگر فایل نبود یا خطی داشت که با # شروع می‌شد، نادیده گرفته می‌شود.
          EXTRA="book/images/historical-requests.txt"
          if [ -f "$EXTRA" ]; then
            while IFS='|' read -r fname url; do
              [ -z "${fname// /}" ] && continue
              case "$fname" in \#*) continue ;; esac
              download_one "$fname" "$url"
            done < "$EXTRA"
          fi


          if [ -n "${failed:-}" ]; then
            echo "::warning::Some files failed to download:$failed"
          fi

      - name: Commit and push
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add book/images/historical
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add historical images to book/images/historical"
          git push
