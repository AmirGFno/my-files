name: build-watermark-free

on:
  push:
    branches: [arena/4a21732a-my-files]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download source PDF
        run: |
          mkdir -p ci
          URL="https://cf.linkulu.com/dl/6ae1aa03c8b58d63b66d7e6d"
          curl -sSL -A "Mozilla/5.0" --max-time 600 -o original.pdf \
               -w "http_code=%{http_code} size=%{size_download}\n" "$URL" | tee ci/fetch.txt
          ls -l original.pdf | tee -a ci/fetch.txt
          sha256sum original.pdf | tee -a ci/fetch.txt

      - name: Install PyMuPDF
        run: pip install --quiet pymupdf

      - name: Strip watermarks and validate
        run: |
          OUT="KECHAP_BOOK_بیست‌ینو قریشی 1406 (بدون واترمارک).pdf"
          mkdir -p docs
          python tools/strip_watermarks.py original.pdf "$OUT" validation_report.txt 2>&1 | tee ci/process.log
          for f in cover p151 last; do [ -f "$f.png" ] && cp "$f.png" "docs/render_$f.png"; done
          rm -f original.pdf
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "ASSET_NAME=KECHAP_BOOK_BISTINO_1406_watermark-free.pdf" >> "$GITHUB_ENV"

      - name: Publish release asset (UTF-8 safe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python tools/publish_release.py "$OUT"

      - name: Build README
        run: python tools/make_readme.py

      - name: Commit report, README and renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md validation_report.txt ci docs
          git commit -m "docs: validation report, renders, README" || echo "nothing to commit"
          git push || echo "push skipped"
