name: build-watermark-free

on:
  workflow_dispatch:
  push:
    branches: [arena/4a21732a-my-files]
    paths:
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download source PDF
        run: |
          mkdir -p ci
          URL="https://cf.linkulu.com/dl/6ae1aa03c8b58d63b66d7e6d"
          curl -sSL -A "Mozilla/5.0" --max-time 600 -o original.pdf \
               -w "http_code=%{http_code} size=%{size_download}\n" "$URL" | tee ci/fetch.txt
          ls -l original.pdf | tee -a ci/fetch.txt
          sha256sum original.pdf | tee -a ci/fetch.txt

      - name: Install deps
        run: pip install --quiet pymupdf numpy scipy

      - name: Stage 2 - strip watermarks
        run: |
          A="KECHAP_BOOK_بیست‌ینو قریشی 1406 (بدون واترمارک).pdf"
          python tools/strip_watermarks.py original.pdf "$A" validation_report.txt 2>&1 | tee ci/process.log
          mkdir -p docs
          for f in cover p151 last; do [ -f "$f.png" ] && cp "$f.png" "docs/render_$f.png"; done
          echo "STAGE2=$A" >> "$GITHUB_ENV"

      - name: Stage 3 - repair black scan edges
        run: |
          B="KECHAP_BOOK_بیست‌ینو قریشی 1406 (ترمیم‌شده).pdf"
          time python tools/repair_edges.py "$STAGE2" "$B" 2>&1 | tee ci/repair.log
          echo "STAGE3=$B" >> "$GITHUB_ENV"

      - name: Validate edge repair
        run: |
          python tools/edge_stats.py "$STAGE2" "$STAGE3" 2>&1 | tee ci/edge_stats.log
          for f in cover text last; do [ -f "$f.png" ] && cp "$f.png" "docs/edge_$f.png"; done
          for f in diff_cover diff_last; do [ -f "$f.png" ] && cp "$f.png" "docs/$f.png"; done

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DELETE_OLD: "1"
        run: |
          python - <<'PY'
          import json, os
          assets = [
              {"path": os.environ["STAGE2"],
               "name": "KECHAP_BOOK_BISTINO_1406_watermark-free.pdf",
               "label": "stage2"},
              {"path": os.environ["STAGE3"],
               "name": "KECHAP_BOOK_BISTINO_1406_edges-repaired.pdf",
               "label": "stage3"},
          ]
          with open("/tmp/assets.json", "w", encoding="utf-8") as f:
              json.dump(assets, f, ensure_ascii=False)
          print(json.dumps(assets, ensure_ascii=False, indent=2))
          PY
          ASSETS="$(cat /tmp/assets.json)" python tools/publish_release.py

      - name: Build README
        run: python tools/make_readme.py

      - name: Commit report, README and renders
        run: |
          rm -f original.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md validation_report.txt edge_stats.txt ci docs
          git commit -m "docs: stage3 edge repair report, renders, README" || echo "nothing to commit"
          git push || echo "push skipped"
