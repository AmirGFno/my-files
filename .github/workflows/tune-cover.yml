name: tune-cover-edges
on:
  push:
    paths:
      - .ci-tune
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download source
        run: curl -sSL -A "Mozilla/5.0" --max-time 600 -o original.pdf "https://cf.linkulu.com/dl/6ae1aa03c8b58d63b66d7e6d"
      - name: Deps
        run: pip install --quiet pymupdf numpy scipy
      - name: Stage 2
        run: python tools/strip_watermarks.py original.pdf clean.pdf v.txt
      - name: Edge crops before/after
        run: |
          mkdir -p docs
          python - <<'PY' 2>&1 | tee tune.txt
          import os, sys, importlib, numpy as np, pymupdf
          sys.path.insert(0, "tools")
          os.environ.update(ART_DARKMAX=os.environ.get("ART_DARKMAX","120"),
                            ART_SATMAX=os.environ.get("ART_SATMAX","255"),
                            ART_TOL=os.environ.get("ART_TOL","25"),
                            ART_MAXT=os.environ.get("ART_MAXT","120"))
          import repair_edges

          def load(doc, idx):
              p = doc[idx]
              x = [i for i in p.get_images(full=True) if i[7] == "I0"][0][0]
              w = int(doc.xref_get_key(x, "Width")[1]); h = int(doc.xref_get_key(x, "Height")[1])
              return np.frombuffer(doc.xref_stream(x), np.uint8).reshape(h, w, 3).copy(), p

          def save(arr, path):
              pymupdf.Pixmap(pymupdf.csRGB, arr.shape[1], arr.shape[0],
                             np.ascontiguousarray(arr).tobytes(), 0).save(path)

          def crop_sheet(before, after, band=130):
              H, W = before.shape[:2]
              tiles = [(slice(0,H), slice(0,band)), (slice(0,H), slice(W-band,W)),
                       (slice(0,band), slice(0,W)), (slice(H-band,H), slice(0,W))]
              row_b = [before[t] for t in tiles]; row_a = [after[t] for t in tiles]
              gh = max(r.shape[0] for r in row_b + row_a)
              gw = sum(r.shape[1] for r in row_b) + 30
              sheet = np.full((gh*2+16, gw, 3), 255, np.uint8)
              x0 = 0
              for rb, ra in zip(row_b, row_a):
                  sheet[:rb.shape[0], x0:x0+rb.shape[1]] = rb
                  sheet[gh+16:gh+16+ra.shape[0], x0:x0+ra.shape[1]] = ra
                  x0 += rb.shape[1] + 10
              return sheet

          d = pymupdf.open("clean.pdf")
          f6 = lambda g: int((np.concatenate([g[:6,:].ravel(),g[-6:,:].ravel(),g[:,:6].ravel(),g[:,-6:].ravel()])<120).sum())
          f40 = lambda g: int((np.concatenate([g[:40,:].ravel(),g[-40:,:].ravel(),g[:,:40].ravel(),g[:,-40:].ravel()])<120).sum())
          for pno, tag in ((1, "cover"), (283, "last")):
              arr, page = load(d, pno-1)
              best = None
              for tol in (25, 40, 60, 90):
                  os.environ["ART_TOL"] = str(tol)
                  importlib.reload(repair_edges)
                  out, kind = repair_edges.fix_page(arr)
                  g0 = arr.astype(np.float32).mean(axis=2); g1 = out.astype(np.float32).mean(axis=2)
                  i0 = int((g0[60:-60,60:-60]<120).sum()); i1 = int((g1[60:-60,60:-60]<120).sum())
                  print(f"  {tag} tol={tol:2d}: border6 {f6(g0)}->{f6(g1):4d} border40 {f40(g0)}->{f40(g1):6d} interior {i0}->{i1} delta={i1-i0}")
                  save(crop_sheet(arr, out), f"docs/edges_{tag}_tol{tol}.png")
                  save(out, f"docs/tuned_{tag}_tol{tol}.png")
          d.close()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tune.txt docs
          git commit -m "debug: cover edge crops" || echo nothing
          git push || echo skipped
